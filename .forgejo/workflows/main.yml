name: Main

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # There's no point in building release binaries for PRs, they are slower to build and no one is going to download them
  CARGO_PROFILE: ${{ github.ref == 'refs/heads/master' && '--release' || '' }}
  PROFILE_NAME: ${{ github.ref == 'refs/heads/master' && 'release' || 'debug' }}
  # Don't create artifacts for PRs/branches by default. These are rarely used and consumes space on the CI.
  CREATE_ARTIFACTS: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}

jobs:
  build-webassembly:
    name: "Build (WebAssembly)"
    runs-on: any-arch
    # Skip running on PR events that come from the same repository, it will just duplicate the branch action
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
    - uses: actions/checkout@v6
    - name: Setup Rust
      uses: https://github.com/dtolnay/rust-toolchain@stable
      with:
        targets: "wasm32-unknown-unknown"
    - uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: wasm-${{ env.PROFILE_NAME }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --package kawari ${{ env.CARGO_PROFILE }} --target=wasm32-unknown-unknown --lib --no-default-features

  build:
    name: "Build (${{ matrix.os_name }} ${{ matrix.target_name }})"
    runs-on: ${{ matrix.runs-on }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          target_name: x86_64
          os_name: linux
          runs-on: x86-64
          runs-tests: true
        - target: aarch64-unknown-linux-gnu
          target_name: aarch64
          os_name: linux
          runs-on: arm64
          runs-tests: false
        - target: x86_64-pc-windows-gnu
          target_name: x86_64
          os_name: windows
          runs-on: x86-64
          runs-tests: false

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Rust
      uses: https://github.com/dtolnay/rust-toolchain@stable
      with:
        components: "clippy rustfmt"
        targets: "${{ matrix.target }}"
    - name: Cache mdbook
      uses: actions/cache@v5
      id: cache-mdbook
      with:
        path: |
          ~/.cargo/bin/mdbook
        key: mdbook
    - name: Install mdbook
      if: steps.cache-mdbook.outputs.cache-hit != 'true'
      run: |
        cargo install --git https://github.com/rust-lang/mdBook.git mdbook
    - name: Cache dependencies
      uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          ~/.cargo/bin/
          !~/.cargo/bin/mdbook
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ matrix.os_name }}-${{ matrix.target_name }}-${{ env.PROFILE_NAME }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cmake libclang-dev rsync
    - name: Setup Target (Linux x86_64)
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        wget https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/clang-x64-release.zip
        unzip clang-x64-release.zip
        mkdir oodle
        cp lib/liboodle-network-shared.so oodle/
    - name: Setup Target (Linux aarch64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        wget https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/clang-arm64-release.zip
        unzip clang-arm64-release.zip
        mkdir oodle
        cp lib/liboodle-network-shared.so oodle/
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
    - name: Setup Target (Windows x86_64)
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
    - name: Build
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: cargo build ${{ env.CARGO_PROFILE }} --target ${{ matrix.target }} --features oodle
    - name: Run Clippy
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo clippy --features oodle -- -Dwarnings --target ${{ matrix.target }}
    - name: Run Cargo fmt
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo fmt --check
    - name: Run tests
      if: matrix.runs-tests
      run: cargo test ${{ env.CARGO_PROFILE }} --target ${{ matrix.target }} --features oodle
      env:
        CI: 1
    - name: Build documentation
      if: env.CREATE_ARTIFACTS == 'true'
      run: |
        mdbook build --dest-dir=docs-build ./docs
        mv docs docs-1
        mv docs-build docs
    - name: Set up SSH key
      if: env.CREATE_ARTIFACTS == 'true'
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        printf "Host ryne.moe\nPort 38901\nStrictHostKeyChecking no" >> ~/.ssh/config
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/config
    - name: Upload artifact
      if: env.CREATE_ARTIFACTS == 'true'
      run: |
        mkdir artifact
        echo "${{ github.sha }}" >> artifact/version.txt
        cp target/${{ matrix.target }}/${{ env.PROFILE_NAME }}/kawari-* artifact
        cp -r resources artifact
        cp -r docs artifact
        cp LICENSE artifact
        cp README.md artifact

        pushd artifact
        rm -rf *.d
        rm -rf resources/data
        rm -rf docs/src
        rm -rf docs/book.toml
        chmod +x ./kawari-*

        zip -r ../kawari-${{ matrix.os_name }}-${{ matrix.target_name }}.zip *
        popd

        rsync --recursive kawari-${{ matrix.os_name }}-${{ matrix.target_name }}.zip deploy@ryne.moe:/srv/http/astra-distrib/kawari/
    - name: Upload documentation
      if: env.CREATE_ARTIFACTS == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        cargo doc ${{ env.CARGO_PROFILE }} --no-deps --lib
        rsync --recursive --delete target/doc/ deploy@ryne.moe:/srv/http/kawari-api-docs
        rsync --recursive --delete docs/ deploy@ryne.moe:/srv/http/kawari-docs
